services:
  ruang-bot:
    build: .
    container_name: ruang-bot
    restart: unless-stopped
    environment:
      - OWNER_NUMBER=${OWNER_NUMBER:-}
      - WATCHED_GROUPS=${WATCHED_GROUPS:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LISTEN_TO_SELF=${LISTEN_TO_SELF:-false}
      - BOT_PORT=8791
      - BOT_AUTH_TOKEN=${BOT_AUTH_TOKEN:-}
      - DATA_DIR=/app/data
    volumes:
      - ./auth:/app/auth
      - ./data:/app/data
    # auth/ (WhatsApp session) and data/ (real week) are persisted on the host
    # so they survive rebuilds and restarts.
    ports:
      - "127.0.0.1:8791:8791"
